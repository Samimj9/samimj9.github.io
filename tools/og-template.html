<!doctype html>
<!-- Source for assets/og-image.png (1200x630). Regenerate with tools/make-assets.mjs (see README). -->
<html><head><meta charset="utf-8"><style>
@font-face{font-family:Newsreader;src:url(../assets/fonts/newsreader-latin-wght-normal.woff2);font-weight:200 800}
@font-face{font-family:Inter;src:url(../assets/fonts/inter-latin-wght-normal.woff2);font-weight:100 900}
@font-face{font-family:"JetBrains Mono";src:url(../assets/fonts/jetbrains-mono-latin-400-normal.woff2)}
*{box-sizing:border-box}
body{margin:0;width:1200px;height:630px;background:#0c0e10;color:#ebe9e4;font-family:Inter,sans-serif;position:relative;overflow:hidden}
.grid{position:absolute;inset:0;background-image:linear-gradient(rgba(235,233,228,.07) 1px,transparent 1px),linear-gradient(90deg,rgba(235,233,228,.07) 1px,transparent 1px);background-size:56px 56px}
svg.eeg{position:absolute;left:0;top:0;width:1200px;height:630px}
.txt{position:absolute;left:72px;top:0;bottom:0;width:640px;display:flex;flex-direction:column;justify-content:center}
.eyebrow{font:400 18px "JetBrains Mono";letter-spacing:.08em;text-transform:uppercase;color:#5ccfc3;display:flex;gap:14px;align-items:center;margin-bottom:26px}
.eyebrow:before{content:"";width:36px;height:1px;background:#5ccfc3}
h1{font:400 96px/1 Newsreader,serif;letter-spacing:-.03em;margin:0 0 28px}
p{font:450 26px/1.4 Inter;color:#b4b8bd;margin:0;max-width:560px}
.photo{position:absolute;right:72px;top:72px;width:384px;height:486px;border-radius:6px;overflow:hidden;background:linear-gradient(135deg,rgba(92,207,195,.25),rgba(92,207,195,.05))}
.photo:after{content:"";position:absolute;inset:0;border:1px solid #5ccfc3;transform:translate(14px,14px);border-radius:6px;pointer-events:none}
.photo .wrap{position:absolute;inset:0;overflow:hidden;border-radius:6px}
.photo .m{position:absolute;inset:0;display:grid;place-items:center;font:400 150px Newsreader,serif;color:#5ccfc3}
.photo img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;object-position:center 25%}
</style></head><body>
<div class="grid"></div>
<svg class="eeg" viewBox="0 0 1200 630"><g fill="none" stroke="#5ccfc3" stroke-width="1.4" id="g"></g></svg>
<div class="txt"><div class="eyebrow">Research portfolio</div><h1>Sami<br>Al Majanini</h1><p>Biomedical Engineer · Researcher in EEG Signal Processing &amp; Mechanistic Interpretability</p></div>
<div class="photo"><div class="wrap"><div class="m">SM</div><img src="../assets/img/profile.jpg" alt="" onerror="this.remove()"></div></div>
<script>
const g=document.getElementById('g');
for(let k=0;k<7;k++){let d='';const y0=70+k*78,p=k*1.7;for(let x=0;x<=1200;x+=5){const e=.55+.45*Math.sin(x*.0035+p);const y=y0+Math.sin(x*.045+p)*9*e+Math.sin(x*.13+p*2)*3.2*(1.1-e)+Math.sin(x*.012+p)*10;d+=(x?'L':'M')+x+' '+y.toFixed(1)}
const s=document.createElementNS('http://www.w3.org/2000/svg','path');s.setAttribute('d',d);s.setAttribute('opacity',k%2?.16:.26);g.append(s)}
</script></body></html>
